<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monopoly Türkiye - 4 Kişilik Tablet Oyunu</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f172a;
    }
    .board-grid {
      display: grid;
      grid-template-columns: 1.5fr repeat(9, 1fr) 1.5fr;
      grid-template-rows: 1.5fr repeat(9, 1fr) 1.5fr;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 900px;
    }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border: 1px solid #334155;
      font-size: 0.65rem;
    }
    @media (min-width: 768px) {
      .tile { font-size: 0.75rem; }
    }
    .dice-cube {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden select-none">

  <!-- Top Navigation & Status -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-4 py-2 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-gradient-to-tr from-red-600 to-amber-500 rounded-xl shadow-lg">
        <i data-lucide="building-2" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-red-400 via-amber-300 to-emerald-400 bg-clip-text text-transparent">MONOPOLY TÜRKİYE</h1>
        <p class="text-xs text-slate-400">Tablet Pass & Play Edition</p>
      </div>
    </div>

    <!-- Active Player Header Banner -->
    <div id="active-player-banner" class="flex items-center gap-4 bg-slate-900/90 px-4 py-1.5 rounded-full border border-slate-700 shadow-inner">
      <span class="text-xs font-semibold text-slate-400">SIRA:</span>
      <div class="flex items-center gap-2">
        <span id="player-turn-indicator" class="w-3.5 h-3.5 rounded-full bg-red-500 animate-pulse"></span>
        <span id="player-turn-name" class="font-bold text-sm">Oyuncu 1</span>
      </div>
      <div class="h-4 w-px bg-slate-700"></div>
      <div class="text-emerald-400 font-extrabold text-sm" id="player-turn-balance">₺1.500</div>
    </div>

    <div class="flex gap-2">
      <button onclick="toggleAudio()" id="audio-btn" class="p-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl transition">
        <i data-lucide="volume-2" id="audio-icon" class="w-5 h-5 text-emerald-400"></i>
      </button>
      <button onclick="resetGameModal()" class="p-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl transition">
        <i data-lucide="rotate-ccw" class="w-5 h-5 text-slate-300"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-2 lg:p-4 gap-4 max-w-7xl mx-auto w-full">
    
    <!-- Left Panel: Players Dashboard & Game Logs -->
    <aside class="w-full lg:w-80 flex flex-col gap-3 order-2 lg:order-1">
      <!-- Players Summary Cards -->
      <div class="grid grid-cols-2 lg:grid-cols-1 gap-2.5" id="players-dashboard">
        <!-- Dynamic Player Cards Generated by JS -->
      </div>

      <!-- Action Log Window -->
      <div class="bg-slate-800/60 rounded-2xl border border-slate-700/70 p-3 flex-1 flex flex-col h-40 lg:h-52 shadow-xl">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-700/50">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="scroll" class="w-3.5 h-3.5 text-amber-400"></i> Oyun Günlüğü
          </span>
        </div>
        <div id="game-logs" class="flex-1 overflow-y-auto custom-scrollbar text-xs space-y-1.5 pr-1 text-slate-300">
          <p class="text-slate-500 italic">Oyun başladı! Zar atmak için hazırlan.</p>
        </div>
      </div>
    </aside>

    <!-- Center: Monopoly Board -->
    <section class="flex-1 flex items-center justify-center w-full max-w-[800px] order-1 lg:order-2">
      <div class="board-grid bg-slate-950 rounded-2xl p-1.5 shadow-2xl border border-slate-700/50 relative overflow-hidden" id="board">
        
        <!-- Center Board Controls & Information -->
        <div style="grid-column: 2 / 11; grid-row: 2 / 11;" class="bg-slate-900/95 m-1 rounded-xl border border-slate-800 flex flex-col items-center justify-between p-4 relative shadow-inner overflow-hidden">
          
          <!-- Background Decorative Elements -->
          <div class="absolute inset-0 bg-gradient-to-br from-red-500/5 via-transparent to-emerald-500/5 pointer-events-none"></div>
          <div class="absolute -right-16 -bottom-16 w-64 h-64 bg-amber-500/5 rounded-full blur-3xl"></div>

          <!-- Top Center Logo & Stat -->
          <div class="text-center z-10 pt-2">
            <h2 class="text-2xl font-black tracking-wider text-slate-100 uppercase">TÜRKİYE</h2>
            <p class="text-[10px] font-bold text-amber-500 tracking-widest uppercase mt-0.5">Emlak Krallığı</p>
          </div>

          <!-- Active Dice Display & Controls -->
          <div class="flex flex-col items-center gap-4 z-10 my-auto">
            <div class="flex items-center gap-4" id="dice-container">
              <div id="dice-1" class="w-14 h-14 bg-gradient-to-br from-slate-100 to-slate-300 rounded-2xl shadow-2xl border-2 border-slate-400 flex items-center justify-center text-slate-900 font-extrabold text-2xl transform transition hover:scale-105">
                1
              </div>
              <div id="dice-2" class="w-14 h-14 bg-gradient-to-br from-slate-100 to-slate-300 rounded-2xl shadow-2xl border-2 border-slate-400 flex items-center justify-center text-slate-900 font-extrabold text-2xl transform transition hover:scale-105">
                1
              </div>
            </div>

            <!-- Main Action Buttons -->
            <div class="flex flex-wrap justify-center gap-2">
              <button id="roll-btn" onclick="handleRollDice()" class="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-sm uppercase tracking-wider rounded-xl shadow-lg shadow-emerald-900/40 active:scale-95 transition flex items-center gap-2">
                <i data-lucide="dices" class="w-5 h-5"></i> Zar At
              </button>
              <button id="build-btn" onclick="openBuildModal()" class="px-4 py-3 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold text-sm uppercase tracking-wider rounded-xl shadow-lg shadow-amber-900/40 active:scale-95 transition flex items-center gap-1.5">
                <i data-lucide="home" class="w-4 h-4"></i> Ev / Otel Yap
              </button>
              <button id="end-turn-btn" onclick="endTurn()" disabled class="px-5 py-3 bg-slate-700 opacity-50 cursor-not-allowed text-slate-300 font-bold text-sm uppercase tracking-wider rounded-xl transition flex items-center gap-1.5">
                <i data-lucide="arrow-right-circle" class="w-4 h-4"></i> Tur Tamam
              </button>
            </div>
          </div>

          <!-- Bottom Center Info Bar -->
          <div class="w-full text-center z-10 pb-1">
            <span id="current-action-msg" class="text-xs font-semibold text-amber-400 bg-amber-950/60 border border-amber-800/60 px-3 py-1.5 rounded-full inline-block">
              Sıradaki Oyuncu Zar Atmalı
            </span>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Property & Action Modal -->
  <div id="action-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl transform transition-all relative overflow-hidden">
      <!-- Modal Dynamic Content -->
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Build Houses/Hotels Management Modal -->
  <div id="build-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700">
        <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="hammer" class="w-5 h-5 text-amber-400"></i> İnşaat & İnşaat Yönetimi
        </h3>
        <button onclick="closeBuildModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="py-4 space-y-3 max-h-96 overflow-y-auto custom-scrollbar" id="build-properties-list">
        <!-- Dynamic content for building houses -->
      </div>

      <div class="pt-3 border-t border-slate-700 text-right">
        <button onclick="closeBuildModal()" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 font-semibold text-sm rounded-xl">Kapat</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. GAME DATA STRUCTURES & CONFIGURATION
       ========================================================================== */
    const PLAYER_COLORS = [
      { name: 'Kırmızı', hex: '#ef4444', border: 'border-red-500', bg: 'bg-red-500' },
      { name: 'Mavi', hex: '#3b82f6', border: 'border-blue-500', bg: 'bg-blue-500' },
      { name: 'Yeşil', hex: '#10b981', border: 'border-emerald-500', bg: 'bg-emerald-500' },
      { name: 'Sarı', hex: '#f59e0b', border: 'border-amber-500', bg: 'bg-amber-500' }
    ];

    const COLOR_GROUPS = {
      brown: { name: 'Kahverengi', houseCost: 50 },
      lightBlue: { name: 'Açık Mavi', houseCost: 50 },
      pink: { name: 'Pembe', houseCost: 100 },
      orange: { name: 'Turuncu', houseCost: 100 },
      red: { name: 'Kırmızı', houseCost: 150 },
      yellow: { name: 'Sarı', houseCost: 150 },
      green: { name: 'Yeşil', houseCost: 200 },
      darkBlue: { name: 'Koyu Mavi', houseCost: 200 }
    };

    // 40 Tiles Board Grid Definition
    const TILES = [
      { id: 0, name: "BAŞLANGIÇ", type: "start", price: 0 },
      { id: 1, name: "Adana", type: "property", group: "brown", price: 60, rent: [2, 10, 30, 90, 160, 250] },
      { id: 2, name: "Kamu Fonu", type: "chest" },
      { id: 3, name: "Mersin", type: "property", group: "brown", price: 60, rent: [4, 20, 60, 180, 320, 450] },
      { id: 4, name: "Gelir Vergisi", type: "tax", amount: 200 },
      { id: 5, name: "Otogar", type: "station", price: 200 },
      { id: 6, name: "Trabzon", type: "property", group: "lightBlue", price: 100, rent: [6, 30, 90, 270, 400, 550] },
      { id: 7, name: "Şans", type: "chance" },
      { id: 8, name: "Samsun", type: "property", group: "lightBlue", price: 100, rent: [6, 30, 90, 270, 400, 550] },
      { id: 9, name: "Ordu", type: "property", group: "lightBlue", price: 120, rent: [8, 40, 100, 300, 450, 600] },
      { id: 10, name: "Kodes / Ziyaret", type: "jail" },
      { id: 11, name: "Bursa", type: "property", group: "pink", price: 140, rent: [10, 50, 150, 450, 625, 750] },
      { id: 12, name: "Elektrik Santrali", type: "utility", price: 150 },
      { id: 13, name: "Eskişehir", type: "property", group: "pink", price: 140, rent: [10, 50, 150, 450, 625, 750] },
      { id: 14, name: "Gaziantep", type: "property", group: "pink", price: 160, rent: [12, 60, 180, 500, 700, 900] },
      { id: 15, name: "TCDD Garı", type: "station", price: 200 },
      { id: 16, name: "Antalya", type: "property", group: "orange", price: 180, rent: [14, 70, 200, 550, 750, 950] },
      { id: 17, name: "Kamu Fonu", type: "chest" },
      { id: 18, name: "Alanya", type: "property", group: "orange", price: 180, rent: [14, 70, 200, 550, 750, 950] },
      { id: 19, name: "Bodrum", type: "property", group: "orange", price: 200, rent: [16, 80, 220, 600, 800, 1000] },
      { id: 20, name: "Ücretsiz Otopark", type: "parking" },
      { id: 21, name: "İzmir", type: "property", group: "red", price: 220, rent: [18, 90, 250, 700, 875, 1050] },
      { id: 22, name: "Şans", type: "chance" },
      { id: 23, name: "Çeşme", type: "property", group: "red", price: 220, rent: [18, 90, 250, 700, 875, 1050] },
      { id: 24, name: "Kuşadası", type: "property", group: "red", price: 240, rent: [20, 100, 300, 750, 925, 1100] },
      { id: 25, name: "Liman", type: "station", price: 200 },
      { id: 26, name: "Ankara Kızılay", type: "property", group: "yellow", price: 260, rent: [22, 110, 330, 800, 975, 1150] },
      { id: 27, name: "Çankaya", type: "property", group: "yellow", price: 260, rent: [22, 110, 330, 800, 975, 1150] },
      { id: 28, name: "Su İdaresi", type: "utility", price: 150 },
      { id: 29, name: "Kavaklıdere", type: "property", group: "yellow", price: 280, rent: [24, 120, 360, 850, 1025, 1200] },
      { id: 30, name: "Kodese Git", type: "gotojail" },
      { id: 31, name: "Kadıköy", type: "property", group: "green", price: 300, rent: [26, 130, 390, 900, 1100, 1275] },
      { id: 32, name: "Beşiktaş", type: "property", group: "green", price: 300, rent: [26, 130, 390, 900, 1100, 1275] },
      { id: 33, name: "Kamu Fonu", type: "chest" },
      { id: 34, name: "Nişantaşı", type: "property", group: "green", price: 320, rent: [28, 150, 450, 1000, 1200, 1400] },
      { id: 35, name: "Havalimanı", type: "station", price: 200 },
      { id: 36, name: "Şans", type: "chance" },
      { id: 37, name: "Yeniköy", type: "property", group: "darkBlue", price: 350, rent: [35, 175, 500, 1100, 1300, 1500] },
      { id: 38, name: "Lüks Vergisi", type: "tax", amount: 100 },
      { id: 39, name: "Bebek", type: "property", group: "darkBlue", price: 400, rent: [50, 200, 600, 1400, 1700, 2000] }
    ];

    const CHANCE_CARDS = [
      { text: "Başlangıç noktasına ilerle. ₺200 al!", action: (p) => movePlayerTo(p, 0) },
      { text: "Bebek semtine git!", action: (p) => movePlayerTo(p, 39) },
      { text: "Bursa'ya yolculuk et.", action: (p) => movePlayerTo(p, 11) },
      { text: "Banka temettüsü ödendi. ₺50 kazandın.", action: (p) => changeBalance(p, 50) },
      { text: "Hız cezası yediniz. ₺15 ödeyin.", action: (p) => changeBalance(p, -15) },
      { text: "Doğrudan Kodese git!", action: (p) => sendToJail(p) }
    ];

    const CHEST_CARDS = [
      { text: "Doktor vizite ücreti. ₺50 öde.", action: (p) => changeBalance(p, -50) },
      { text: "Miras geliri! ₺100 kazandın.", action: (p) => changeBalance(p, 100) },
      { text: "Vergi iadesi aldın. ₺20 kazandın.", action: (p) => changeBalance(p, 20) },
      { text: "Tatil sigortanız bitti. ₺100 ödeyin.", action: (p) => changeBalance(p, -100) }
    ];

    /* ==========================================================================
       2. GAME STATE MANAGEMENT
       ========================================================================== */
    let players = [
      { id: 0, name: "Oyuncu 1", money: 1500, pos: 0, inJail: false, jailTurns: 0, bankrupt: false },
      { id: 1, name: "Oyuncu 2", money: 1500, pos: 0, inJail: false, jailTurns: 0, bankrupt: false },
      { id: 2, name: "Oyuncu 3", money: 1500, pos: 0, inJail: false, jailTurns: 0, bankrupt: false },
      { id: 3, name: "Oyuncu 4", money: 1500, pos: 0, inJail: false, jailTurns: 0, bankrupt: false }
    ];

    // Property state tracking: ownerId, houses (0-4), hotel (boolean)
    let propertiesState = {};
    TILES.forEach(tile => {
      if (tile.type === 'property' || tile.type === 'station' || tile.type === 'utility') {
        propertiesState[tile.id] = { owner: null, houses: 0, hotel: false };
      }
    });

    let currentPlayerIdx = 0;
    let hasRolled = false;
    let consecutiveDoubles = 0;
    let audioEnabled = true;

    /* ==========================================================================
       3. SOUND SYNTHESIZER (WEB AUDIO API)
       ========================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!audioEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'dice') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.setValueAtTime(1200, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'build') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.setValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {
        console.log("Audio play error", e);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById('audio-icon');
      if (audioEnabled) {
        icon.setAttribute('data-lucide', 'volume-2');
        icon.classList.remove('text-red-400');
        icon.classList.add('text-emerald-400');
      } else {
        icon.setAttribute('data-lucide', 'volume-x');
        icon.classList.remove('text-emerald-400');
        icon.classList.add('text-red-400');
      }
      lucide.createIcons();
    }

    /* ==========================================================================
       4. BOARD RENDERING & GRID HELPER
       ========================================================================== */
    function getTileGridStyle(index) {
      if (index >= 0 && index <= 10) {
        return `grid-row: 11; grid-column: ${11 - index};`;
      } else if (index > 10 && index <= 20) {
        return `grid-column: 1; grid-row: ${11 - (index - 10)};`;
      } else if (index > 20 && index <= 30) {
        return `grid-row: 1; grid-column: ${index - 19};`;
      } else {
        return `grid-column: 11; grid-row: ${index - 29};`;
      }
    }

    function renderBoard() {
      const board = document.getElementById('board');
      // Clear existing tiles except center container
      const centerContainer = board.querySelector('div[style*="grid-column: 2 / 11"]');
      board.innerHTML = '';
      board.appendChild(centerContainer);

      TILES.forEach(tile => {
        const tileEl = document.createElement('div');
        tileEl.id = `tile-${tile.id}`;
        tileEl.style = getTileGridStyle(tile.id);
        tileEl.className = "tile bg-slate-800/90 border border-slate-700/80 p-1 flex flex-col justify-between cursor-pointer hover:bg-slate-750 transition relative rounded-sm";
        tileEl.onclick = () => showTileDetails(tile.id);

        // Header color bar for property groups
        let headerColor = "";
        if (tile.group === 'brown') headerColor = "bg-amber-900";
        else if (tile.group === 'lightBlue') headerColor = "bg-sky-400";
        else if (tile.group === 'pink') headerColor = "bg-pink-500";
        else if (tile.group === 'orange') headerColor = "bg-orange-500";
        else if (tile.group === 'red') headerColor = "bg-red-600";
        else if (tile.group === 'yellow') headerColor = "bg-amber-400";
        else if (tile.group === 'green') headerColor = "bg-emerald-600";
        else if (tile.group === 'darkBlue') headerColor = "bg-blue-800";

        const propState = propertiesState[tile.id];
        let ownerIndicator = "";
        if (propState && propState.owner !== null) {
          const ownerColor = PLAYER_COLORS[propState.owner].hex;
          ownerIndicator = `<div class="absolute top-0 right-0 w-2.5 h-2.5 rounded-full border border-white" style="background-color: ${ownerColor}"></div>`;
        }

        // Render House / Hotel icons indicator
        let buildingsMarkup = "";
        if (propState) {
          if (propState.hotel) {
            buildingsMarkup = `<div class="flex items-center justify-center bg-red-600 text-[9px] font-black text-white px-1 rounded">1 OTEL</div>`;
          } else if (propState.houses > 0) {
            let housesDots = '';
            for(let h=0; h<propState.houses; h++) {
              housesDots += `<span class="w-1.5 h-1.5 bg-emerald-400 rounded-full inline-block"></span>`;
            }
            buildingsMarkup = `<div class="flex gap-0.5 items-center justify-center bg-slate-900/80 p-0.5 rounded">${housesDots}</div>`;
          }
        }

        tileEl.innerHTML = `
          ${headerColor ? `<div class="h-2.5 w-full ${headerColor} rounded-t-sm -mt-1 -mx-1 mb-1"></div>` : ''}
          ${ownerIndicator}
          <div class="font-bold text-[10px] leading-tight text-center text-slate-200 line-clamp-2">${tile.name}</div>
          ${buildingsMarkup}
          <div class="text-[9px] font-semibold text-center text-slate-400">
            ${tile.price ? '₺' + tile.price : ''}
          </div>
          <div class="player-tokens flex flex-wrap gap-1 justify-center items-center min-h-[14px]" id="tokens-tile-${tile.id}"></div>
        `;

        board.appendChild(tileEl);
      });

      renderPlayerTokens();
    }

    function renderPlayerTokens() {
      // Clear tokens
      TILES.forEach(t => {
        const tokenContainer = document.getElementById(`tokens-tile-${t.id}`);
        if (tokenContainer) tokenContainer.innerHTML = '';
      });

      // Render tokens
      players.forEach(p => {
        if (p.bankrupt) return;
        const container = document.getElementById(`tokens-tile-${p.pos}`);
        if (container) {
          const token = document.createElement('div');
          token.className = `w-3.5 h-3.5 rounded-full border-2 border-white shadow-md flex items-center justify-center text-[8px] font-black text-white transition-transform duration-300`;
          token.style.backgroundColor = PLAYER_COLORS[p.id].hex;
          token.innerText = p.id + 1;
          container.appendChild(token);
        }
      });
    }

    /* ==========================================================================
       5. DASHBOARD & UI UPDATES
       ========================================================================== */
    function updateUI() {
      // Active turn player header
      const cur = players[currentPlayerIdx];
      document.getElementById('player-turn-indicator').style.backgroundColor = PLAYER_COLORS[cur.id].hex;
      document.getElementById('player-turn-name').innerText = cur.name;
      document.getElementById('player-turn-balance').innerText = `₺${cur.money}`;

      // Render Dashboard list
      const dash = document.getElementById('players-dashboard');
      dash.innerHTML = '';
      players.forEach(p => {
        const isActive = p.id === currentPlayerIdx;
        const card = document.createElement('div');
        card.className = `p-3 rounded-2xl border transition ${isActive ? 'bg-slate-800 border-amber-500 shadow-lg shadow-amber-500/10' : 'bg-slate-800/40 border-slate-700/60 opacity-80'} ${p.bankrupt ? 'line-through opacity-40' : ''}`;
        
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full" style="background-color: ${PLAYER_COLORS[p.id].hex}"></span>
              <span class="font-bold text-xs ${isActive ? 'text-amber-400' : 'text-slate-300'}">${p.name}</span>
            </div>
            ${p.inJail ? '<span class="text-[9px] bg-red-900/60 text-red-300 px-1.5 py-0.5 rounded border border-red-700">Kodes</span>' : ''}
          </div>
          <div class="flex justify-between items-baseline mt-1.5">
            <span class="text-xs text-slate-400">Bakiye:</span>
            <span class="font-extrabold text-sm text-emerald-400">₺${p.money}</span>
          </div>
        `;
        dash.appendChild(card);
      });
    }

    function addLog(msg) {
      const logs = document.getElementById('game-logs');
      const item = document.createElement('div');
      item.className = "py-1 border-b border-slate-700/40 flex items-start gap-1.5";
      item.innerHTML = `<span class="text-amber-400 font-bold">•</span> <span>${msg}</span>`;
      logs.prepend(item);
    }

    /* ==========================================================================
       6. CORE GAME LOGIC & ACTIONS
       ========================================================================== */
    function handleRollDice() {
      if (hasRolled) return;
      const player = players[currentPlayerIdx];

      playSound('dice');

      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      const sum = d1 + d2;
      const isDouble = d1 === d2;

      document.getElementById('dice-1').innerText = d1;
      document.getElementById('dice-2').innerText = d2;

      addLog(`${player.name} zarları attı: <strong>${d1} - ${d2}</strong> (${sum})`);

      if (player.inJail) {
        if (isDouble) {
          player.inJail = false;
          player.jailTurns = 0;
          addLog(`${player.name} çift atarak Kodesten çıktı!`);
        } else {
          player.jailTurns++;
          addLog(`${player.name} Kodesten çıkamadı. (${player.jailTurns}/3)`);
          hasRolled = true;
          document.getElementById('roll-btn').disabled = true;
          document.getElementById('roll-btn').classList.add('opacity-50');
          document.getElementById('end-turn-btn').disabled = false;
          document.getElementById('end-turn-btn').classList.remove('opacity-50', 'cursor-not-allowed');
          updateUI();
          return;
        }
      }

      if (isDouble) {
        consecutiveDoubles++;
        if (consecutiveDoubles === 3) {
          addLog(`${player.name} 3 kez üst üste çift attığı için Kodese gönderildi!`);
          sendToJail(player);
          endRollState();
          return;
        }
      } else {
        consecutiveDoubles = 0;
      }

      // Move player
      movePlayer(player, sum);

      if (!isDouble) {
        hasRolled = true;
        document.getElementById('roll-btn').disabled = true;
        document.getElementById('roll-btn').classList.add('opacity-50');
        document.getElementById('end-turn-btn').disabled = false;
        document.getElementById('end-turn-btn').classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        document.getElementById('current-action-msg').innerText = "Çift Attınız! Tekrar Zar Atabilirsiniz.";
      }

      updateUI();
    }

    function movePlayer(player, steps) {
      let oldPos = player.pos;
      player.pos = (player.pos + steps) % 40;

      // Passed START bonus
      if (player.pos < oldPos) {
        player.money += 200;
        playSound('coin');
        addLog(`${player.name} Başlangıç noktasından geçti ve <strong>₺200</strong> maaş aldı!`);
      }

      renderPlayerTokens();
      handleTileLand(player, TILES[player.pos]);
    }

    function movePlayerTo(player, targetPos) {
      player.pos = targetPos;
      renderPlayerTokens();
      handleTileLand(player, TILES[player.pos]);
    }

    function sendToJail(player) {
      player.pos = 10;
      player.inJail = true;
      player.jailTurns = 0;
      renderPlayerTokens();
      updateUI();
    }

    function handleTileLand(player, tile) {
      document.getElementById('current-action-msg').innerText = `${player.name}, ${tile.name} karesinde.`;

      if (tile.type === 'property' || tile.type === 'station' || tile.type === 'utility') {
        const state = propertiesState[tile.id];
        if (state.owner === null) {
          // Unowned property option to buy
          openBuyModal(player, tile);
        } else if (state.owner !== player.id) {
          // Pay rent
          const owner = players[state.owner];
          let rent = calculateRent(tile);
          addLog(`${player.name}, ${tile.name} karesinde ${owner.name}'e <strong>₺${rent}</strong> kira ödemeli.`);
          payRent(player, owner, rent);
        }
      } else if (tile.type === 'tax') {
        addLog(`${player.name} <strong>₺${tile.amount}</strong> vergi ödedi.`);
        changeBalance(player, -tile.amount);
      } else if (tile.type === 'gotojail') {
        addLog(`${player.name} "Kodese Git" karesine bastı!`);
        sendToJail(player);
      } else if (tile.type === 'chance') {
        const card = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)];
        showCardModal("Şans Kartı", card.text, () => card.action(player));
      } else if (tile.type === 'chest') {
        const card = CHEST_CARDS[Math.floor(Math.random() * CHEST_CARDS.length)];
        showCardModal("Kamu Fonu Kartı", card.text, () => card.action(player));
      }
    }

    function calculateRent(tile) {
      const state = propertiesState[tile.id];
      if (tile.type === 'property') {
        if (state.hotel) return tile.rent[5];
        if (state.houses > 0) return tile.rent[state.houses];
        // Standard rent or doubled if full set owned
        const groupTiles = TILES.filter(t => t.group === tile.group);
        const ownsAll = groupTiles.every(t => propertiesState[t.id].owner === state.owner);
        return ownsAll ? tile.rent[0] * 2 : tile.rent[0];
      } else if (tile.type === 'station') {
        const count = TILES.filter(t => t.type === 'station' && propertiesState[t.id].owner === state.owner).length;
        return 25 * Math.pow(2, count - 1);
      } else if (tile.type === 'utility') {
        const count = TILES.filter(t => t.type === 'utility' && propertiesState[t.id].owner === state.owner).length;
        return count === 2 ? 100 : 40;
      }
      return 0;
    }

    function payRent(payer, payee, amount) {
      if (payer.money < amount) {
        amount = payer.money; // Pay what remains
        declareBankruptcy(payer);
      } else {
        payer.money -= amount;
        payee.money += amount;
        playSound('coin');
      }
      updateUI();
    }

    function changeBalance(player, amount) {
      player.money += amount;
      if (amount > 0) playSound('coin');
      if (player.money < 0) {
        declareBankruptcy(player);
      }
      updateUI();
    }

    function declareBankruptcy(player) {
      player.bankrupt = true;
      addLog(`<span class="text-red-400 font-bold">${player.name} İFLAS ETTİ!</span>`);
      // Release owned properties
      Object.keys(propertiesState).forEach(id => {
        if (propertiesState[id].owner === player.id) {
          propertiesState[id].owner = null;
          propertiesState[id].houses = 0;
          propertiesState[id].hotel = false;
        }
      });
      renderBoard();
      updateUI();
      checkWinCondition();
    }

    function checkWinCondition() {
      const activePlayers = players.filter(p => !p.bankrupt);
      if (activePlayers.length === 1) {
        showCardModal("Tebrikler!", `Oyunun Kazananı: ${activePlayers[0].name}! 🎉`, () => location.reload());
      }
    }

    function endTurn() {
      hasRolled = false;
      consecutiveDoubles = 0;
      
      // Advance to next non-bankrupt player
      do {
        currentPlayerIdx = (currentPlayerIdx + 1) % 4;
      } while (players[currentPlayerIdx].bankrupt);

      document.getElementById('roll-btn').disabled = false;
      document.getElementById('roll-btn').classList.remove('opacity-50');
      document.getElementById('end-turn-btn').disabled = true;
      document.getElementById('end-turn-btn').classList.add('opacity-50', 'cursor-not-allowed');

      document.getElementById('current-action-msg').innerText = "Sıradaki Oyuncu Zar Atmalı";
      updateUI();
    }

    function endRollState() {
      hasRolled = true;
      document.getElementById('roll-btn').disabled = true;
      document.getElementById('roll-btn').classList.add('opacity-50');
      document.getElementById('end-turn-btn').disabled = false;
      document.getElementById('end-turn-btn').classList.remove('opacity-50', 'cursor-not-allowed');
    }

    /* ==========================================================================
       7. MODALS & UI INTERACTION (BUYING & BUILDING)
       ========================================================================== */
    function openBuyModal(player, tile) {
      const modal = document.getElementById('action-modal');
      const body = document.getElementById('modal-body');

      const canAfford = player.money >= tile.price;

      body.innerHTML = `
        <div class="text-center space-y-4">
          <div class="inline-block p-3 rounded-full bg-amber-500/10 border border-amber-500/30">
            <i data-lucide="building" class="w-8 h-8 text-amber-400"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-100">${tile.name} Satın Alınabilir!</h3>
          <p class="text-sm text-slate-300">Fiyat: <strong class="text-emerald-400 text-base">₺${tile.price}</strong></p>
          <p class="text-xs text-slate-400">Bu mülkü satın alarak diğer oyunculardan kira toplayabilirsiniz.</p>
          
          <div class="flex gap-3 justify-center pt-2">
            <button id="buy-confirm-btn" ${!canAfford ? 'disabled' : ''} class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:opacity-50 text-white font-bold rounded-xl transition">
              Satın Al (₺${tile.price})
            </button>
            <button onclick="closeModal()" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold rounded-xl transition">
              Pas Geç
            </button>
          </div>
        </div>
      `;
      lucide.createIcons();
      modal.classList.remove('hidden');

      const confirmBtn = document.getElementById('buy-confirm-btn');
      if (confirmBtn) {
        confirmBtn.onclick = () => {
          player.money -= tile.price;
          propertiesState[tile.id].owner = player.id;
          playSound('coin');
          addLog(`${player.name}, <strong>${tile.name}</strong> mülkünü ₺${tile.price} karşılığında satın aldı!`);
          renderBoard();
          updateUI();
          closeModal();
        };
      }
    }

    function showTileDetails(tileId) {
      const tile = TILES[tileId];
      const state = propertiesState[tileId];
      const modal = document.getElementById('action-modal');
      const body = document.getElementById('modal-body');

      let ownerText = "Sahipsiz";
      if (state && state.owner !== null) {
        ownerText = players[state.owner].name;
      }

      body.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center pb-2 border-b border-slate-700">
            <h3 class="text-lg font-bold text-slate-100">${tile.name}</h3>
            <span class="text-xs font-semibold px-2 py-1 bg-slate-700 rounded text-amber-400">${tile.type.toUpperCase()}</span>
          </div>
          <div class="text-xs space-y-1 text-slate-300">
            <p><strong>Sahibi:</strong> ${ownerText}</p>
            ${tile.price ? `<p><strong>Satın Alma Fiyatı:</strong> ₺${tile.price}</p>` : ''}
            ${state ? `<p><strong>Ev Sayısı:</strong> ${state.houses}</p>` : ''}
            ${state ? `<p><strong>Otel Durumu:</strong> ${state.hotel ? 'Var' : 'Yok'}</p>` : ''}
            ${tile.rent ? `<p class="mt-2 font-bold text-amber-400">Kira Listesi:</p>
              <ul class="list-disc pl-4 text-[11px] text-slate-400">
                <li>Arsa Kirası: ₺${tile.rent[0]}</li>
                <li>1 Evli: ₺${tile.rent[1]}</li>
                <li>2 Evli: ₺${tile.rent[2]}</li>
                <li>3 Evli: ₺${tile.rent[3]}</li>
                <li>4 Evli: ₺${tile.rent[4]}</li>
                <li>Otel: ₺${tile.rent[5]}</li>
              </ul>` : ''}
          </div>
          <div class="text-right">
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 font-bold text-xs rounded-xl">Kapat</button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function openBuildModal() {
      const player = players[currentPlayerIdx];
      const modal = document.getElementById('build-modal');
      const listContainer = document.getElementById('build-properties-list');
      listContainer.innerHTML = '';

      // Find all property groups owned by player
      const ownedProperties = TILES.filter(t => t.type === 'property' && propertiesState[t.id].owner === player.id);

      if (ownedProperties.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-4">İnşaat yapabileceğiniz bir mülkünüz bulunmuyor.</p>`;
      } else {
        ownedProperties.forEach(tile => {
          const groupTiles = TILES.filter(t => t.group === tile.group);
          const ownsFullSet = groupTiles.every(t => propertiesState[t.id].owner === player.id);
          const pState = propertiesState[tile.id];
          const houseCost = COLOR_GROUPS[tile.group].houseCost;

          const item = document.createElement('div');
          item.className = "bg-slate-900/80 p-3 rounded-xl border border-slate-700 flex justify-between items-center";

          let statusText = `${pState.houses} Ev`;
          if (pState.hotel) statusText = "1 Otel (Maks)";

          item.innerHTML = `
            <div>
              <h4 class="font-bold text-sm text-slate-200">${tile.name}</h4>
              <p class="text-xs text-slate-400">Durum: <span class="text-amber-400 font-semibold">${statusText}</span></p>
              <p class="text-xs text-slate-400">Maliyet: <span class="text-emerald-400 font-semibold">₺${houseCost}</span> / Ev-Otel</p>
            </div>
            <div>
              ${!ownsFullSet 
                ? `<span class="text-[10px] bg-red-950 text-red-400 px-2 py-1 rounded border border-red-800">Tüm Renk Seti Gerekli</span>`
                : `<button onclick="buildStructure(${tile.id})" ${pState.hotel || player.money < houseCost ? 'disabled' : ''} class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold text-xs rounded-lg transition">
                    ${pState.houses === 4 ? 'Otele Yükselt' : 'Ev İnşa Et'}
                   </button>`
              }
            </div>
          `;
          listContainer.appendChild(item);
        });
      }

      modal.classList.remove('hidden');
    }

    function buildStructure(tileId) {
      const player = players[currentPlayerIdx];
      const tile = TILES[tileId];
      const pState = propertiesState[tileId];
      const houseCost = COLOR_GROUPS[tile.group].houseCost;

      if (player.money >= houseCost && !pState.hotel) {
        player.money -= houseCost;
        if (pState.houses < 4) {
          pState.houses++;
          addLog(`${player.name}, <strong>${tile.name}</strong> üzerine 1 ev inşa etti!`);
        } else if (pState.houses === 4) {
          pState.houses = 0;
          pState.hotel = true;
          addLog(`${player.name}, <strong>${tile.name}</strong> üzerindeki evleri Otele dönüştürdü! 🎉`);
        }
        playSound('build');
        renderBoard();
        updateUI();
        openBuildModal(); // Refresh modal
      }
    }

    function showCardModal(title, desc, callback) {
      const modal = document.getElementById('action-modal');
      const body = document.getElementById('modal-body');

      body.innerHTML = `
        <div class="text-center space-y-4">
          <h3 class="text-xl font-bold text-amber-400">${title}</h3>
          <p class="text-sm text-slate-200 leading-relaxed">${desc}</p>
          <button id="card-ok-btn" class="px-6 py-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold rounded-xl transition">
            Tamam
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      document.getElementById('card-ok-btn').onclick = () => {
        closeModal();
        if (callback) callback();
      };
    }

    function closeModal() {
      document.getElementById('action-modal').classList.add('hidden');
    }

    function closeBuildModal() {
      document.getElementById('build-modal').classList.add('hidden');
    }

    function resetGameModal() {
      showCardModal("Oyunu Sıfırla", "Oyunu yeniden başlatmak istediğinizden emin misiniz?", () => {
        location.reload();
      });
    }

    /* ==========================================================================
       8. INIT GAME ON LOAD
       ========================================================================== */
    window.onload = function() {
      renderBoard();
      updateUI();
      lucide.createIcons();
    };
  </script>
</body>
</html>
